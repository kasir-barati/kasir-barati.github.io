<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Post Title</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-200 antialiased selection:bg-cyan-400/30">
    <header id="top" class="border-b border-slate-800 bg-slate-950/90">
        <div class="mx-auto max-w-7xl px-5 py-5 sm:px-8">
            <div class="flex items-center justify-between gap-4">
                <h1 class="text-4xl font-black tracking-tight text-white sm:text-6xl">Post Title</h1>
                <a href="/#/posts"
                    class="z-10 inline-flex shrink-0 items-center gap-2 self-center rounded-full bg-slate-800 px-2.5 py-1.5 text-[0.8rem] font-semibold text-slate-100 no-underline shadow-[0_2px_8px_rgba(0,0,0,0.15)] transition hover:-translate-y-0.5 hover:bg-slate-900 hover:shadow-[0_6px_20px_rgba(0,0,0,0.25)] active:translate-y-0 sm:px-[18px] sm:py-2.5 sm:text-[0.95rem]"
                    title="Go to Posts">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path
                            d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm7 1.5V9h5.5L13 3.5zM8 13h8v2H8zm0 4h5v2H8z" />
                    </svg>
                    <span class="hidden sm:inline">Posts</span>
                </a>
            </div>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-5 pb-14 pt-8 lg:pb-20">
        <p class="mb-4 text-sm font-semibold uppercase tracking-[0.2em] text-cyan-400">Category / kicker</p>
        <p class="mt-6 text-lg leading-8 text-slate-400 sm:text-xl">
            One or two sentences introducing the post.
        </p>

        <section class="mt-14">
            <p class="leading-7 text-slate-300">
                Body content goes here.
            </p>
        </section>
    </main>

    <footer class="border-t border-slate-800">
        <div
            class="mx-auto flex md:justify-end max-w-7xl flex-col gap-3 px-5 py-8 text-sm text-slate-500 sm:px-8 sm:flex-row sm:items-center sm:justify-between">
            <a href="#top" class="text-slate-300 hover:text-white">Back to top ↑</a>
        </div>
    </footer>
</body>

</html>
